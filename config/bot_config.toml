[a_memorix.advanced] # 高级运行时配置
enable_auto_save = true # 是否启用自动保存
auto_save_interval_minutes = 5 # 自动保存间隔
debug = false # 是否启用调试


[a_memorix.web.tuning] # 调优中心配置
enabled = true # 是否启用调优中心
max_queue_size = 8 # 最大队列长度
poll_interval_ms = 1200 # 轮询间隔毫秒数
default_intensity = "standard" # 默认调优强度
default_objective = "precision_priority" # 默认调优目标
default_top_k_eval = 20 # 默认评估 Top-K
default_sample_size = 24 # 默认样本数

[a_memorix.web.import] # 导入中心配置
enabled = true # 是否启用导入中心
max_queue_size = 20 # 最大队列长度
max_files_per_task = 200 # 单任务最大文件数
max_file_size_mb = 20 # 单文件大小上限 MB
max_paste_chars = 200000 # 粘贴字符数上限
default_file_concurrency = 2 # 默认文件并发
default_chunk_concurrency = 4 # 默认分块并发
default_narrative_window_size = 1600 # 默认叙事抽取窗口字符数
default_narrative_overlap = 400 # 默认叙事窗口重叠字符数
default_factual_target_size = 1200 # 默认事实分块目标字符数
max_chunk_chars = 3200 # 单个抽取分块的字符上限

[a_memorix.web.import.timeout] # 导入中心超时配置
llm_call_seconds = 240.0 # Web 导入中单次 LLM 抽取调用的超时时间，0 表示不额外限制
process_poll_seconds = 1.0 # 迁移或转换子进程状态轮询等待时间
process_terminate_seconds = 5.0 # 取消任务时等待子进程正常终止的时间
process_kill_seconds = 3.0 # 取消任务时强制结束子进程后的等待时间
convert_preflight_seconds = 20.0 # LPMM 转换依赖预检的超时时间

[message_receive]
image_parse_threshold = 5 # 单条消息图片数不超过这个值时才识图，避免图片太多拖慢处理。
ban_words = [] # 包含这些词的消息会被过滤，不进入麦麦处理。
ban_msgs_regex = [] # 用正则过滤消息；适合更复杂的过滤规则。

[voice]
enable_asr = false # 开启后麦麦可以把语音消息识别成文字再处理。

[emoji]
emoji_send_num = 25 # 每次从多少个候选表情里挑一个发送；不是一次发送这么多。
max_reg_num = 64 # 最多保存多少个可用表情。
do_replace = true # 表情满了以后是否用新表情替换旧表情。
check_interval = 10 # 每隔多少分钟检查一次表情库状态。
steal_emoji = true # 是否从聊天中自动收集别人发的表情。
max_emoji_size_mb = 5.0 # 收集表情时允许的最大文件大小；0 表示不限。
content_filtration = false # 开启后只保存内容合适的表情。

[emoji.cache_cleanup] # 定期清理未注册表情包缓存，减少磁盘占用；已注册表情包不会被清理。
enabled = true # 开启后会自动删除长期未注册、未使用的表情包缓存。
check_interval_hours = 6.0 # 每隔多少小时检查一次旧表情包缓存。
emoji_file_retention_days = 30 # 未注册表情包文件多久没被使用后可以删除；已注册表情包永远不会由该任务删除。
no_file_record_retention_days = 30 # 未注册表情包文件删掉后，描述缓存记录还能保留多久。

[keyword_reaction]
keyword_rules = [] # 命中关键词后，给麦麦追加一段固定反应提示。
regex_rules = [] # 命中正则规则后，给麦麦追加一段固定反应提示。

[response_post_process]
enable_response_post_process = true # 开启后会对回复做错别字、分段等后处理。
typing_speed = 1.0 # 模拟打字等待时间；0 最快，1 默认，2 更慢。

[chinese_typo]
enable = true # 让麦麦偶尔打错字，更像真人聊天。
error_rate = 0.01 # 单个字被替换成错字的概率。
min_freq = 9 # 只对常见程度达到该值的字尝试制造错字。
tone_error_rate = 0.1 # 按相近声调制造错字的概率。
word_replace_rate = 0.006 # 整词被替换成错词的概率。

[response_splitter]
enable = true # 把过长回复拆成多条发送。
max_length = 512 # 单条回复允许的最大长度。
max_sentence_num = 8 # 单条回复最多包含多少个句子。
max_split_num = 3 # 一次回复最多拆成几条消息。
enable_kaomoji_protection = false # 尽量避免把颜文字从中间拆开。
enable_overflow_return_all = false # 句子太多时是否直接保留完整回复，不再强行截断。

[log]
date_style = "m-d H:i:s" # 日志时间的显示格式。
log_level_style = "lite" # 日志等级的显示样式，只影响日志外观。
color_text = "full" # 控制台日志颜色范围。
log_level = "INFO" # 全局最低日志等级；DEBUG 最详细，ERROR 最安静。
console_log_level = "INFO" # 控制台输出的最低日志等级。
file_log_level = "DEBUG" # 写入日志文件的最低日志等级。
log_file_max_bytes = 5242880 # 单个日志文件超过这个大小后会轮转。
max_log_files = 30 # 最多保留多少个主日志文件。
log_cleanup_days = 30 # 主日志文件超过多少天后清理。
llm_request_snapshot_limit = 128 # 失败模型请求快照最多保留多少份。
maisaka_prompt_preview_limit = 256 # 每个聊天最多保留多少组 Prompt 预览。
maisaka_reply_effect_limit = 256 # 每个聊天最多保留多少条回复效果记录。
suppress_libraries = ["faiss", "httpx", "urllib3", "asyncio", "websockets", "httpcore", "requests", "sqlalchemy", "openai", "uvicorn", "jieba"] # 完全不显示日志的第三方库名称列表。
library_log_levels = {aiohttp = "WARNING", PIL = "WARNING"} # 单独设置某些第三方库的日志等级。

[debug]
show_maisaka_thinking = true # 在日志或界面中显示麦麦的思考过程。
show_jargon_prompt = false # 调试黑话学习时显示相关 Prompt。
show_memory_prompt = false # 调试记忆检索时显示相关 Prompt。
enable_reply_effect_tracking = false # 记录回复效果评分，方便观察回复质量。
keep_prompt_preview_json_base64 = false # Prompt 预览里保留图片 base64，便于复现但会占空间。
record_tool_structured_content = false # 保存工具返回的结构化内容，便于调试但会增加数据库体积。
enable_llm_cache_stats = false # 记录模型 prompt cache 统计，用于性能调试。

[maim_message]
ws_server_host = "127.0.0.1" # 旧版 WebSocket 服务监听地址；不清楚就保持默认。
ws_server_port = 8000 # 旧版 WebSocket 服务端口。
auth_token = [] # 旧版 API 的认证令牌；为空表示不验证。
enable_api_server = false # 是否开启新版 API Server，供外部程序调用麦麦。
api_server_host = "0.0.0.0" # 新版 API Server 监听地址；0.0.0.0 表示允许外部访问。
api_server_port = 8090 # 新版 API Server 监听端口。
api_server_use_wss = false # 新版 API Server 是否使用加密 WebSocket。
api_server_cert_file = "" # WSS 使用的证书文件路径。
api_server_key_file = "" # WSS 使用的私钥文件路径。
api_server_allowed_api_keys = [] # 允许访问新版 API 的 Key 列表；为空表示不限制。

[webui]
enabled = true # 是否启动 WebUI 管理界面。
host = ["127.0.0.1", "::1"] # WebUI 监听地址列表；可同时绑定 IPv4 和 IPv6，例如 ["0.0.0.0", "::"]。
port = 8001 # WebUI 访问端口。
mode = "production" # WebUI 运行模式；普通使用保持 production。
webui_style = 1 # 界面风格编号；0 为旧风格，1 为未来复古风格。
anti_crawler_mode = "basic" # 防爬虫策略；basic 只记录，strict/loose 会拦截更多请求。
allowed_ips = "127.0.0.1" # 允许访问 WebUI 的 IP，多个用逗号分隔。
trusted_proxies = "" # 可信反向代理 IP；只有这些代理传来的真实 IP 会被信任。
trust_xff = false # 是否信任 X-Forwarded-For 里的真实访客 IP。
secure_cookie = false # 只在 HTTPS 下发送登录 Cookie；没有 HTTPS 时不要开启。
enforce_public_outbound_url = true # 限制 WebUI 访问外部 URL，降低访问内网地址的风险。

[watchdog]
touch_interval_s = 1.0 # touch 刷新间隔（秒），事件循环正常时刷新存活时间戳的周期。
check_interval_s = 5.0 # 检测判定间隔（秒），独立线程判定周期。
mild_threshold_s = 3.0 # 轻度卡顿阈值（秒），距上次 touch 超过此值记轻度卡顿。
severe_threshold_s = 10.0 # 严重阻塞阈值（秒），距上次 touch 超过此值记严重阻塞；必须大于 mild_threshold_s。
consecutive_report_threshold = 2 # 连续超时上报阈值 N，连续 N 次严重判定才上报。
cooldown_s = 30.0 # 冷却窗口（秒），同一异常源在冷却内不重复上报。
v1_poll_interval_s = 10.0 # V1 旁路轮询间隔（秒）。
v2_diff_interval_s = 5.0 # V2 状态 diff 轮询间隔（秒）。

[control_message]
# ZG-8 控制消息优先级 — 对标 Linux 信号机制（带优先级、可屏蔽、有不可捕获特权通道的事件投递系统）。
version = 1 # 配置版本号（版本化升级：只改模板 + 新增版本号，不改动 legacy_migration）。
global_enabled = false # 全局开关（渐进启用；false 时控制消息按原有逻辑处理，ZG-8 透明运行）。
unmaskable_whitelist = [1, 2, 3] # 不可屏蔽类别白名单（系统级强制编号 1-3，运行时不可修改）。
private_queue_limit = 256 # 会话私有 pending 队列节点数上限（防控制消息风暴）。
shared_queue_limit = 1024 # 系统共享 pending 队列节点数上限。
unkillable_entities = ["agent:primary", "component:orchestrator", "component:message_port"] # UNKILLABLE 实体清单（Orchestrator 运行时声明的补充）。
system_blocked_kinds = [] # 系统级屏蔽集（默认空；编号 1-3 会被引擎强制剔除）。
system_ignored_kinds = [] # 系统级忽略集（默认空；编号 1-3 会被引擎强制剔除）。
delivery_history_limit = 100 # 投递决策历史环形缓冲上限。
diffuse_timeout_sec = 5.0 # 致命扩散超时（秒）。
force_caller_whitelist = ["watchdog", "service_manager", "system_state_machine"] # force 通道调用方白名单（系统核心层；插件和 WebUI 普通接口不可调用）。

[tainted_mask]
# ZG-7 污染标记 — 对标 Linux tainted_mask（不可逆污染位图，只增不减）。
on_taint = {} # 污染动作映射（key=标志名如 TAINT_PORT_BYPASS，value=动作如 trigger_degrade/warn；缺省仅记录）。
warn_limit = 0 # WARN 累计阈值（warn_count 达到后触发降级；0=禁用）。
preset_mask = 0 # 预置位掩码（启动即置位，如测试模式预置 128）。
degrade_on_taint_mask = 0 # 掩码级降级触发掩码（0=禁用；位在掩码中则自动触发降级，对标 Linux panic_on_taint）。


[error_escalation]
# ZG-14 错误升级梯 — 对标 Linux panic_on_warn / warn_limit / panic_on_oops。
# 错误沿 WARN→ERROR→CRITICAL→FATAL 单向递进；最高动作 STOP_CORE 优雅停机，不杀进程（N2 裁决）。
error_on_warn = false # True 时 WARN 上报升级 ERROR（对标 panic_on_warn）。
warn_error_threshold = 0 # WARN 累计达阈升级 ERROR（0=禁用；>0 按计数窗口累计）。
critical_on_error = false # True 时 ERROR 上报升级 CRITICAL（对标 panic_on_oops）。
error_critical_threshold = 0 # ERROR 累计达阈升级 CRITICAL（0=禁用）。
critical_fatal_threshold = 0 # CRITICAL 累计达阈升级 FATAL（0=禁用）。
level_actions = null # 按等级覆盖默认动作集（如 {"warn": ["log"]}；null=用默认动作集）。
count_window_sec = 0.0 # 计数窗口（秒；0=全局累计不归零，>0 按窗口归零）。
crash_dump_min_level = "critical" # 主动快照最低触发等级（warn/error/critical/fatal）。
storm_min_threshold = 100 # 风暴检测独立下限阈值（计数阈值=0 时风暴检测仍用此值）。


[system_state]
history_capacity = 100 # 迁移历史环形缓冲容量（条）。
notify_timeout = 5.0 # 通知链超时（秒），订阅者超时记告警并视为放行。

[event_bus]
rollback_timeout = 5.0 # robust 回滚单个 on_rollback 超时（秒）。
vote_history_capacity = 100 # 内省投票历史环形缓冲容量（条）。

[mcp]
enable = true # 是否启用 MCP 工具接入能力。
servers = []

[mcp.client] # 麦麦作为 MCP 客户端时声明的能力。
client_name = "MaiBot" # 对 MCP 服务器展示的客户端名称。
client_version = "1.0.0" # 对 MCP 服务器展示的客户端版本。

[mcp.client.roots] # 是否向 MCP 服务器提供可访问的文件根目录。
enable = false # 是否向 MCP 服务器暴露 Roots 能力。
items = [] # 允许 MCP 服务器看到的目录或资源列表。

[mcp.client.sampling] # 是否允许 MCP 服务器请求麦麦调用模型。
enable = false # 是否声明支持 MCP Sampling。
task_name = "planner" # MCP Sampling 调用模型时使用的任务名。
include_context_support = false # 是否允许 Sampling 请求带上下文。
tool_support = false # Sampling 过程中是否允许继续使用工具。

[mcp.client.elicitation] # 是否允许 MCP 服务器向麦麦请求补充信息。
enable = false # 是否声明支持 MCP Elicitation。
allow_form = true # 是否允许 MCP 服务器请求填写表单。
allow_url = false # 是否允许 MCP 服务器请求打开 URL。
# 要连接的 MCP 服务器列表。

[plugin]
permission = [] # 允许用聊天命令管理插件的用户，格式如 qq:123456789。

[plugin_runtime]
enabled = true # 是否启用新版插件运行时。
health_check_interval_sec = 30.0 # 每隔多少秒检查一次插件运行状态。
max_restart_attempts = 3 # 插件 Runner 崩溃后最多自动重启几次。
runner_spawn_timeout_sec = 30.0 # 等待插件 Runner 启动完成的最长时间。
hook_blocking_timeout_sec = 60.0 # 单个阻塞 Hook 最多允许运行多久。
ipc_socket_path = "" # 自定义插件通信 Socket 路径；留空自动生成。

[plugin_runtime.render] # 插件需要网页截图或渲染时使用的浏览器配置。
enabled = true # 是否允许插件使用浏览器渲染能力。
browser_ws_endpoint = "" # 已有 Chrome/Chromium 的调试地址；留空则自动启动。
executable_path = "" # 浏览器程序路径；留空自动查找。
browser_install_root = "data/playwright-browsers" # 自动下载浏览器时保存的位置。
headless = true # 是否隐藏浏览器窗口运行。
launch_args = ["--disable-gpu", "--disable-dev-shm-usage", "--disable-setuid-sandbox", "--no-sandbox", "--no-zygote"] # 启动浏览器时附加的命令参数。
concurrency_limit = 2 # 同时最多运行多少个渲染任务。
startup_timeout_sec = 20.0 # 浏览器启动或连接的最长等待时间。
render_timeout_sec = 15.0 # 单次渲染任务的最长等待时间。
auto_download_chromium = true # 找不到浏览器时是否自动下载 Chromium。
download_connection_timeout_sec = 120.0 # 下载 Chromium 时的连接超时时间。
restart_after_render_count = 200 # 渲染多少次后重启浏览器；0 表示不自动重启。

[plugin_runtime_v2]
enabled = false
host_listen_address = "0.0.0.0:50051"
runner_spawn_count = 1
runner_spawn_timeout_sec = 30.0
health_check_interval_sec = 60.0
max_restart_attempts = 3
scope_approval_file = "data/scope_approvals.json"
default_rpm = 60

# ZG16-5 scopes 强制化审计
enable_scope_audit = true                                      # 是否启用 Tier 1 运行时审计（默认开启）
audit_log_path = "data/plugin_runtime_v2/scope_audit.log"      # 审计日志文件路径
audit_log_max_size_mb = 10                                     # 审计日志轮转大小阈值 MB（范围 1-100）
audit_log_backup_count = 5                                     # 审计日志历史文件保留数（范围 1-20）
tier1_scopes = [                                               # Tier 1 高危 scope 列表（可配置扩展）
    "system:execute:cli",
    "system:read:screenshot",
    "system:read:location",
    "account:execute:operation",
    "finance:read:qr_code",
    "network:fetch:url",
]
sensitive_param_names = ["token", "password", "secret", "api_key", "apikey", "credential"]  # 敏感参数名表（脱敏用）

[agent]
default_agent_id = "silver_wolf" # 新会话未绑定智能体时使用的默认智能体 ID。
agents_dir = "agents" # 智能体 Markdown 配置文件的存放目录。

[python_runtime]
free_threaded = false # 启用 Python 3.14t 自由线程模式，禁用 GIL 以提升多线程并行性能。
gc_tuning_enabled = true # 启用 GC 调优，根据运行时内存分配模式自动调整各代阈值。

[agent_interaction]
enabled = true # 启用后，智能体之间会根据情绪、时间、关系等信号自动产生交互。
evaluation_interval_seconds = 300 # 调度器遍历所有智能体评估交互触发的间隔秒数。
cooldown_minutes = 30 # 同一对智能体两次交互之间的最短冷却时间。
max_interactions_per_hour = 2 # 同一对智能体每小时最多允许的交互次数。
max_interactions_per_day = 8 # 同一对智能体每天最多允许的交互次数。
echo_enabled = true # 交互事件是否触发回声传播。
echo_max_depth = 3 # 回声传播的最大链式深度。
echo_decay_ratio = 0.5 # 回声传播时影响量的衰减比例。
monologue_enabled = true # 智能体空闲且情绪强烈时是否触发内心独白。
monologue_min_interval_minutes = 15 # 同一智能体两次内心独白之间的最短间隔。
monologue_idle_threshold_minutes = 30 # 智能体空闲多久后才可能触发内心独白。
monologue_emotion_intensity_threshold = 40 # 主导情绪强度超过此阈值时才可能触发内心独白。

[agent_autonomy]
enabled = true # 启用后，智能体将以角色内部视角思考，拥有内在需求和行为意图。
max_active_agents = 14 # 同一会话中同时活跃的智能体数量上限。
auto_exit_timeout_minutes = 60 # 活跃智能体超过此时间未发言则自动退场。
interjection_enabled = true # 非主发言智能体可基于行为意图自主决定插话。
interjection_intent_threshold = 60.0 # 行为意图强度达到此阈值才可能触发插话。
interjection_cooldown_minutes = 5 # 同一智能体两次插话之间的最短冷却时间。
max_interjections_per_hour = 3 # 同一智能体每小时最多允许的插话次数。
max_interjections_per_session_per_hour = 6 # 同一会话每小时所有智能体的插话总次数上限。
interaction_signal_intent_bonus = 40.0 # 交互信号对行为意图的额外加成强度。
embodied_planner_enabled = true # 启用后 Planner 将以角色内部视角思考，而非旁观者视角。
speaker_tag_format = "【{agent_name}】" # 多智能体发言时的标记格式，支持 {agent_name} 和 {agent_id} 占位符。
orchestrator_strategy = "default" # Orchestrator 的调度策略名称，可通过注册机制扩展。
intent_expiry_seconds = 300 # 行为意图超过此时间后自动失效。
vitality_base_value = 30.0 # 智能体进入待命状态时的初始生命力值。
vitality_activation_threshold = 70.0 # 生命力达到此阈值时待命智能体自动跃迁为活跃。
vitality_decay_per_minute = 2.0 # 待命智能体每分钟自然衰减的生命力值。
vitality_stimulus_message = 5.0 # 待命智能体感知到消息时增加的生命力值。
vitality_stimulus_mention = 20.0 # 待命智能体被直接提及时增加的生命力值。
vitality_stimulus_topic = 10.0 # 待命智能体感知到话题相关时增加的生命力值。
vitality_tick_interval_seconds = 60 # 生命力心跳评估的间隔秒数。
fallback_exit_timeout_minutes = 120 # 待命智能体超过此时间且生命力为0时退场为沉睡。
cohabitation_threshold_reduction = 10.0 # 共居智能体数量≥3时，插话阈值降低的基础值。
cohabitation_cooldown_reduction_minutes = 1.0 # 共居智能体数量≥3时，冷却时间缩短的基础值。
interjection_threshold_minimum = 20.0 # 动态插话阈值的最低下限。
interjection_cooldown_minimum_minutes = 1.0 # 动态冷却时间的最低下限。
active_visible_to_active = true # 活跃智能体对活跃智能体是否可见。
standby_visible_to_active = true # 待命智能体对活跃智能体是否可见。
standby_emotion_visible_to_active = false # 待命智能体的情绪是否对活跃智能体可见。
dormant_visible_to_any = false # 沉睡智能体是否对任何智能体可见。
state_awareness_enabled = true # 启用后，智能体可感知共居智能体的状态信息。

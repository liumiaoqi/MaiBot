[build-system]
requires = ["setuptools>=80.9.0"]
build-backend = "setuptools.build_meta"

[project]
name = "MaiBot"
version = "1.0.11"
description = "MaiCore 是一个基于大语言模型的可交互智能体"
requires-python = ">=3.14"
dependencies = [
    "Babel>=2.17.0",
    "aiohttp>=3.14.3",
    "certifi",
    "colorama>=0.4.6",
    "faiss-cpu>=1.11.0",
    "fastapi>=0.116.0",
    "google-genai>=1.39.1",
    "httpx[socks]",
    "jieba>=0.42.1",
    "json-repair>=0.60.1",
    "maim-message==0.6.8",
    "maibot-dashboard>=1.5.4",
    "maibot-plugin-sdk>=2.7.0",
    "mcp>=1.28.1,<2.0",
    "msgpack>=1.2.1",
    "numpy>=2.2.6",
    "openai>=1.95.0",
    "pandas>=2.3.1",
    "pillow>=12.3.0",
    "playwright>=1.54.0",
    "pyarrow>=20.0.0",
    "pydantic>=2.11.7",
    "pypinyin>=0.54.0",
    "python-multipart>=0.0.31",
    "rapidfuzz",
    "rich>=14.0.0",
    "scipy>=1.7.0",
    "sqlalchemy>=2.0.40",
    "sqlmodel>=0.0.24",
    "structlog>=25.4.0",
    "tomlkit>=0.13.3",
    "typing-extensions",
    "uvicorn>=0.35.0",
    "watchfiles>=1.1.1",
    "ahocorasick-rs>=1.0.3",
    "pyyaml>=6.0.3",
]

[dependency-groups]
dev = [
    "grpcio>=1.83.0",
    "grpcio-reflection>=1.83.0",
    "grpcio-tools>=1.83.0",
    "jsonschema>=4.0",
    "pytest",
    "pytest-asyncio",
    "ruff>=0.12.2",
    "zstandard",
]


[tool.pytest.ini_options]
markers = ["benchmark: 性能基准用例（NFR-PER 验收），常规回归不运行", "integration: 端到端集成测试，需真实数据库/host_service 基础设施"]
addopts = "-m 'not benchmark and not integration' --import-mode=importlib --ignore=lab --ignore=pytests/phoenix1_test/test_grpc_transport.py --ignore=tests/plugin_runtime_v2/test_mcp_e2e.py --ignore=tests/plugin_runtime_v2/test_napcat_v4.py --ignore=tests/plugin_runtime_v2/test_v1_compat.py"
# asyncio_mode 必须在此段（pytest-asyncio 1.x 不读 [tool.pytest-asyncio] 独立段）
asyncio_mode = "auto"
# importlib 模式：pytests/webui 与 tests/webui 同模块名共存（ImportPathMismatchError 修复）
# --import-mode 是命令行选项（pytest 9.x 未注册为 ini option），放在 addopts 中
# 项目根进 sys.path：tests/ 目录独立跑时不依赖 pytests/conftest.py 的 sys.path 副作用
pythonpath = ["."]

[tool.uv]
index-url = "https://pypi.tuna.tsinghua.edu.cn/simple"

[tool.ruff]

include = ["*.py"]

# 行长度设置
line-length = 120

[tool.ruff.lint]
fixable = ["ALL"]
unfixable = []

# 如果一个变量的名称以下划线开头，即使它未被使用，也不应该被视为错误或警告。
dummy-variable-rgx = "^(_+|(_+[a-zA-Z0-9_]*[a-zA-Z0-9]+?))$"

# 启用的规则
select = [
    "E", # pycodestyle 错误
    "F", # pyflakes
    "B", # flake8-bugbear
    "TID", # flake8-tidy-imports
]

ignore = ["E711", "E501", "TID252"]

[tool.ruff.lint.flake8-tidy-imports.banned-api]
"src.A_memorix.core" = {msg = "核心模块禁止直接导入 A_memorix 内部实现，请通过 MemoryServicePort Protocol 接口交互"}
"src.A_memorix.core.runtime" = {msg = "核心模块禁止直接导入 A_memorix 运行时，请通过 MemoryServicePort Protocol 接口交互"}
"src.A_memorix.core.runtime.sdk_memory_kernel" = {msg = "核心模块禁止直接导入 SDKMemoryKernel，请通过 MemoryServicePort Protocol 接口交互"}
"src.services.send_service._text_to_stream" = {msg = "禁止直接调用 send_service 发送函数，请使用 get_message_port_v2().send_message()"}
"src.services.send_service._text_to_stream_with_message" = {msg = "禁止直接调用 send_service 发送函数，请使用 get_message_port_v2().send_message()"}
"src.services.send_service._emoji_to_stream" = {msg = "禁止直接调用 send_service 发送函数，请使用 get_message_port_v2().send_message()"}
"src.services.send_service._emoji_to_stream_with_message" = {msg = "禁止直接调用 send_service 发送函数，请使用 get_message_port_v2().send_message()"}
"src.services.send_service._image_to_stream" = {msg = "禁止直接调用 send_service 发送函数，请使用 get_message_port_v2().send_message()"}
"src.services.send_service._custom_to_stream" = {msg = "禁止直接调用 send_service 发送函数，请使用 get_message_port_v2().send_message()"}
"src.services.send_service._custom_reply_set_to_stream" = {msg = "禁止直接调用 send_service 发送函数，请使用 get_message_port_v2().send_message()"}
"src.services.send_service._send_to_target_with_message" = {msg = "禁止直接调用 send_service 内部函数，请使用 get_message_port_v2().send_message()"}
"src.config.config.config_manager" = {msg = "禁止直接导入 config_manager 获取模型配置，请使用 ModelConfigPort Protocol 接口"}
"src.config.config.model_config" = {msg = "禁止直接导入 model_config 模块变量，请使用 ModelConfigPort Protocol 接口"}
"src.chat.message_receive.bot.napcat_notice_sub_type" = {msg = "核心层禁止读取 napcat_* 字段，通知分类应在入站点完成（notice_type_mapping.py → NoticeKind）"}
"src.maisaka.agent.registry.AgentConfigRegistry" = {msg = "禁止直接导入 AgentConfigRegistry，请使用 AgentConfigProvider Protocol 接口（get_agent_config_provider()）"}
"src.services.llm_service.LLMServiceClient" = {msg = "禁止直接导入 LLMServiceClient，请使用 LLMService Protocol 接口（get_llm_service()）"}
"src.chat.message_receive.bot.chat_bot" = {msg = "禁止直接导入 chat_bot 全局单例，请使用 MessageIngestionPort Protocol 接口（get_message_ingestion_port()）"}
"src.person_info.person_info.Person" = {msg = "禁止直接导入 Person 类，请使用 PersonInfoPort Protocol 接口（get_person_info_port()）"}
"src.config.config.global_config" = {msg = "禁止直接导入 global_config，请使用 BotConfigPort/ChatConfigPort/AppConfigPort Protocol 接口"}
"src.core.event_bus.AutonomyEventBus.get_instance" = {msg = "禁止调用 AutonomyEventBus.get_instance()，请使用 AutonomyEventBusPort 构造注入"}
"src.services.send_service.SendServiceMessagePortV2" = {msg = "核心禁止直接导入 SendServiceMessagePortV2，请通过 message_port_registry 注入"}
"src.core.adapters.resource_limit_adapter.ResourceLimitAdapter" = {msg = "核心 port_registry 禁止导入适配器具体类，请使用 ResourceLimitPort Protocol 类型标注，由 main.py 注入"}
"src.core.adapters.system_lifecycle_adapter.SystemLifecycleAdapter" = {msg = "核心 port_registry 禁止导入适配器具体类，请使用 Any 类型标注，由 main.py 注入"}
"src.core.adapters.watchdog_adapter.WatchdogAdapter" = {msg = "核心禁止直接导入 WatchdogAdapter，请使用 WatchdogPort Protocol 接口"}
"src.core.adapters.service_manager_adapter.ServiceManagerAdapter" = {msg = "核心禁止直接导入 ServiceManagerAdapter，请使用 ServiceManagerPort Protocol 接口"}
"src.plugin_runtime.integration" = {msg = "核心禁止直接导入 plugin_runtime 组件，请通过 Protocol 或 port_registry 获取 IPC 桥接能力"}
"src.chat.heart_flow.heartflow_manager.heartflow_manager" = {msg = "禁止直接导入 heartflow_manager 全局单例，请使用 ChatRuntimeRegistry Protocol 接口（get_chat_runtime_registry()）"}
"logging" = {msg = "禁止直接 import logging，请使用 src.common.logger.get_logger() 统一入口；受控 stdlib_logging 用法见 .codeartsdoer/specs/zg2_log_pipeline/spec.md 附录 A 受控清单"}

[tool.ruff.lint.per-file-ignores]
"src/core/adapters/*" = ["TID251"]
"src/core/person_info_port_registry.py" = ["TID251"]
"src/main.py" = ["TID251"]
"src/services/llm_service.py" = ["TID251"]
"src/services/memory_service.py" = ["TID251"]

"src/maisaka/message_port.py" = ["TID251"]
"src/plugin_runtime/hook_catalog.py" = ["TID251"]
"src/A_memorix/**" = ["TID251"]
"src/config/config.py" = ["TID251"]
"src/chat/heart_flow/heartflow_manager.py" = ["TID251"]
"src/chat/heart_flow/heartflow_message_processor.py" = ["TID251"]
"src/services/html_render_service.py" = ["TID251"]
"src/services/telemetry_stats_service.py" = ["TID251"]
"src/plugin_runtime_v2/proto/*_pb2*.py" = ["F401", "E402"]
"src/common/logger.py" = ["TID251", "TID253"]
"src/webui/routers/log.py" = ["TID251", "TID253"]
"src/plugin_runtime/host/logger_bridge.py" = ["TID251", "TID253"]
"src/plugin_runtime/runner/log_handler.py" = ["TID251", "TID253"]
"src/plugin_runtime/runner/runner_main.py" = ["TID251", "TID253"]
"src/plugin_runtime/protocol/envelope.py" = ["TID251", "TID253"]
"src/A_memorix/scripts/migrate_maibot_memory.py" = ["TID251", "TID253"]  # 仅 bootstrap fallback 受控用途
"src/common/log_pipeline/*" = ["TID251", "TID253"]  # 操作 stdlib LogRecord 的受控用途
"pytests/log_pipeline_test/*" = ["TID251"]  # 测试构造 stdlib LogRecord 的受控用途
"pytests/A_memorix_test/*" = ["TID251"]  # A_memorix 测试直测内部实现（MemoryServicePort 契约由集成测试覆盖）
"pytests/common_test/*" = ["TID251"]  # 测试直测 global_config 配置结构（配置读取走 port 的契约由 webui 测试覆盖）
"lab/**" = ["TID251", "B007", "F841", "E741", "B905", "E731", "E722", "E701", "B023", "E702"]  # 实验原型区：不适用生产规范（2026-08-03 全仓 ruff 清理裁定）
"tests/test_t092_stress.py" = ["TID251"]  # 压力测试直测内部实现
"scripts/**" = ["TID251"]  # 运维/工具脚本直测内部实现（一次性或手动运行，非服务代码）
"pytests/config_test/test_config_base.py" = ["TID251"]  # 测试构造 stdlib LogRecord（受控用途，同 log_pipeline_test 先例）
"pytests/webui/test_memory_routes_integration.py" = ["TID251"]  # 端到端集成测试直连 A_memorix 内部（同 A_memorix_test 先例）
"tests/unit/a_memorix/*" = ["TID251"]  # ZG-27 A_memorix 内部模块单元测试（直测内部实现，MemoryServicePort 契约由集成测试覆盖）
".codeartsdoer/temp/**" = ["ALL"]  # 临时接受目录（非源码）

[tool.ruff.format]
docstring-code-format = true
indent-style = "space"


# 使用双引号表示字符串
quote-style = "double"

# 尊重魔法尾随逗号
# 例如：
# items = [
#     "apple",
#     "banana",
#     "cherry",
# ]
skip-magic-trailing-comma = false

# 自动检测合适的换行符
line-ending = "auto"

# AI 实验区独立工作区声明（scripts/embedding_finetune——2026-08-17 升级）
#
# 作用：
#   1. 本目录 = MaiBot 所有 AI 相关实验统一工作区（embedding 微调 / SNN 脉冲网络 / 小模型 / 新架构验证）
#   2. 本目录内的 uv 命令（uv venv / uv run / uv sync / uv pip install）自动使用本目录的 .venv，
#      与主项目（MaiBot 根）环境彻底隔离——主项目的 uv run 永远不会冲掉这里
#   3. requires-python 锁定 3.12（torch 训练栈在 3.12 最稳）
#   4. torch 自动从 cu128+ 索引安装（RTX 50 系 Blackwell 必需）
#
# 用法：
#   cd scripts/embedding_finetune
#   uv venv --python 3.12 .venv
#   uv pip install -e .          # 或 uv sync——按本文件声明装依赖
#   python run_train_v1.py       # embedding 微调训练
#   python snn_behavior/xxx.py   # SNN 行为实验（新实验子目录 + NOTES.md）
#
# 新实验依赖：加进下方 dependencies（如 snntorch），uv 增量安装——不要用裸 pip

[project]
name = "maibot-embedding-finetune"
version = "0.1.0"
description = "MaiBot 本地 embedding 模型微调工作区（与主项目隔离，3.12 + cu128）"
requires-python = ">=3.12,<3.13"
dependencies = [
    # torch 必须显式声明为直接依赖——[tool.uv.sources] 只对直接依赖生效，
    # 否则 uv 从 PyPI 解析 CPU 版（传递依赖），GPU 永远装不上
    "torch>=2.13",
    "sentence-transformers[training]>=3.0",
    "accelerate>=1.1.0",
    "optimum[onnxruntime]>=1.20",
    "onnx>=1.16",
    "onnxscript",
    "onnxruntime>=1.18",
    "fastapi",
    "uvicorn",
    "numpy",
    "matplotlib",
    # SNN 脉冲网络实验（2026-08-17 加——AI 实验区，动物行为模拟用）
    "snntorch>=0.8",
]

[tool.setuptools]
# 本目录是脚本工作区不是包——声明空包，排除数据/产物目录
py-modules = []

[tool.setuptools.packages.find]
exclude = ["data*", "output*", "onnx_model*"]

[tool.uv]
# torch 从 cu130 专用索引安装（RTX 5060 Blackwell sm_120 需要 cu128+，cu130 有 2.13.0）
[[tool.uv.index]]
name = "pytorch-cu130"
url = "https://download.pytorch.org/whl/cu130"
explicit = true

[tool.uv.sources]
torch = { index = "pytorch-cu130" }

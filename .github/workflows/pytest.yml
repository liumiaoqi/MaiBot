name: Pytest

# 这条 workflow 是新增的：此前 `uv run pytest` 不在任何 CI 里——本地验收要求跑双目录全量，
# CI 不跑。
#
# 2026-11-21 转阻断：`pytests/maisaka_test` 的 50 个既有失败已清零（TokenMeter 测试态装配
# + 伪造输入补齐），全量实测 5434 passed / 0 failed。
#
# ⚠️ 命令不写在这里：统一 `python3 scripts/task.py verify --only test`，本地与 CI 同源。
on:
  pull_request:
  push:
    branches: [main]

jobs:
  pytest:
    runs-on: ubuntu-24.04
    env:
      # CI 的 uv 默认取最新 Python（3.15），但 ahocorasick-rs 的 PyO3 只支持到 3.14
      UV_PYTHON: "3.14"
      # 项目在 pyproject 里配了清华源（国内加速），GitHub runner 在海外连不上
      UV_INDEX_URL: https://pypi.org/simple
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - name: pytest 全量（tests/ + pytests/）
        run: python3 scripts/task.py verify --only test

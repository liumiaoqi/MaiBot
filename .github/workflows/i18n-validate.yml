name: i18n Validate

# ⚠️ 命令不写在这里：统一 `python3 scripts/task.py verify --only i18n`，本地与 CI 同源。
# 这个 workflow 此前只做 setup-python 就直接跑脚本，而 `scripts/i18n_validate.py` import
# `src.common.prompt_i18n`（依赖 tomlkit）⇒ CI 上必然 ModuleNotFoundError。改走 task.py 后
# 由 `uv run python` 保证依赖齐备，这条门禁才真正生效。

on:
  pull_request:
    paths:
      - "locales/**/*.json"
      - "prompts/**/*.prompt"
      - "dashboard/src/i18n/index.ts"
      - "dashboard/src/i18n/locales/*.json"
      - "scripts/i18n_validate.py"
      - "src/common/i18n/**/*.py"
      - "src/common/prompt_i18n.py"
      - "src/prompt/prompt_manager.py"
  push:
    branches:
      - main
      - r-dev
    paths:
      - "locales/**/*.json"
      - "prompts/**/*.prompt"
      - "dashboard/src/i18n/index.ts"
      - "dashboard/src/i18n/locales/*.json"
      - "scripts/i18n_validate.py"
      - "src/common/i18n/**/*.py"
      - "src/common/prompt_i18n.py"
      - "src/prompt/prompt_manager.py"

jobs:
  validate:
    runs-on: ubuntu-24.04

    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - name: Validate locale files
        run: python3 scripts/task.py verify --only i18n

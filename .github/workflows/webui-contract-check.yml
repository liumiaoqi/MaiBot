name: WebUI 契约层一致性检查

on:
  pull_request:
    paths:
      - mingtang/src/lib/**
      - mingtang/src/types/**
      - mingtang/scripts/contract/**
      - mingtang/openapi/**
      - mingtang/package.json
      - mingtang/pnpm-lock.yaml

jobs:
  contract-check:
    runs-on: ubuntu-latest
    env:
      # CI 的 uv 默认取最新 Python（3.15），但 ahocorasick-rs 的 PyO3 只支持到 3.14
      UV_PYTHON: "3.14"
      # 项目在 pyproject 里配了清华源（国内加速），GitHub runner 在海外连不上
      UV_INDEX_URL: https://pypi.org/simple
    steps:
      - name: 检出
        uses: actions/checkout@v4

      - name: 安装 pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.28.5

      - name: 安装 Node
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: 配置 pnpm store（先于 install，规避 mingtang/.npmrc 的本地路径）
        run: pnpm config set store-dir "$RUNNER_TEMP/pnpm-store"

      - name: 安装依赖
        working-directory: mingtang
        run: pnpm install --frozen-lockfile

      - name: 契约一致性检查（只读快照，不访问后端）
        run: python3 scripts/task.py verify --only contract

      - name: 写入 step summary（结论 + 分工说明）
        if: always()
        working-directory: mingtang
        run: |
          {
            echo '### WebUI 契约层检查'
            echo ''
            if [ -f openapi/last-check.json ]; then
              node -e "const r=require('./openapi/last-check.json');console.log('- verdict: \`'+r.verdict+'\`');console.log('- '+r.message)"
            else
              echo '- 未生成 last-check.json'
            fi
            echo ''
            sed -n '/^## CI 与后端漂移的分工$/,/^## /p' openapi/coverage-report.md | sed '$d'
          } >> "$GITHUB_STEP_SUMMARY"
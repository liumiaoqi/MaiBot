name: Ruff PR Check

# 命令不写在这里：统一 `python3 scripts/task.py verify --only lint`，本地与 CI 同源。
#
# 2026-11-21 转阻断：全仓 `uv run ruff check` 已到 0 条。scripts/ 与 lab/ 的排版类规则
# 按口径在 pyproject 放宽（保留 F821 未定义名 / B023 循环变量捕获 / B904 raise 无 from），
# AI 实验区 scripts/embedding_finetune 是独立项目、由 extend-exclude 排除。
on:
  pull_request:
    paths:
      - "*.py"
      - "**/*.py"
      - "pyproject.toml"
      - "ruff.toml"
      - ".ruff.toml"
      - "setup.cfg"
      - "tox.ini"
      - ".pre-commit-config.yaml"
jobs:
  ruff:
    runs-on: ubuntu-24.04
    env:
      # CI 的 uv 默认取最新 Python（3.15），但 ahocorasick-rs 的 PyO3 只支持到 3.14
      UV_PYTHON: "3.14"
      # 项目在 pyproject 里配了清华源（国内加速），GitHub runner 在海外连不上
      UV_INDEX_URL: https://pypi.org/simple
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: astral-sh/setup-uv@v5
      - name: Ruff 静态检查
        run: python3 scripts/task.py verify --only lint

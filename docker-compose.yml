services:
  core:
    container_name: maim-bot-core
    pull_policy: never
    #### prod ####
    image: maibot:ubuntu-migration
    #image: sengokucola/maibot:latest
    #image: sengokucola/maibot:1.0.0-rc.2
    # image: infinitycat/maibot:latest
    #### dev ####
    # image: sengokucola/maibot:dev
    # image: infinitycat/maibot:dev
    # 入口脚本：使用镜像内 ENTRYPOINT（/MaiMBot/docker-entrypoint.sh）；
    # 2026-10-15 移除 wrapper 包装（原 wrapper 的 sed 补丁/去重段已并入或删除，见 docker-entrypoint.sh 头注释）

    # === ZG-9 资源控制 ===
    mem_limit: 4g
    mem_reservation: 2g
    mem_swappiness: 0
    oom_kill_disable: false
    oom_score_adj: -500
    tmpfs:
      - /tmp:size=512M

    environment:
      - TZ=Asia/Shanghai
      - EULA_AGREE=8e6e7d647f7f82d6ea98456b73908656
      - PRIVACY_AGREE=91e5db7659c560bc3545e63859b6ebc0
      - MAIBOT_LEGACY_0X_UPGRADE_CONFIRMED=1 # Docker 无法交互确认旧版升级迁移，默认跳过确认提示
      - MAIBOT_WEBUI_STATIC_DIR=mingtang/dist # WebUI 静态资源目录（默认 mingtang/dist；回退旧前端设为 dashboard/dist）
      - MAIBOT_STATISTICS_REPORT_PATH=/MaiMBot/data/maibot_statistics.html # 统计数据输出到共享目录，首次运行可自动创建文件
      - WEBUI_HOST=0.0.0.0 # Docker 中需要监听全部容器网卡，宿主机才能通过端口映射访问 WebUI
      # === 密钥外部化（3 段 · 2026-10-16）===
      # 值来自宿主：compose 项目目录下的 `.env`（自动加载）或宿主 shell 环境变量——**先有值者胜**。
      # 容器内只拿到"进程环境"；配置里写 `api_key = "${VAR}"`，应用读配置时解析（缺变量即响亮报错，不静默空串）。
      # 用 `:-` 而不是 `:?`：双读期明文配置仍然合法，不能因为"环境变量没设"就让 compose 拒绝起容器。
      # ⚠️ 迁移顺序：先让这两个键有值（.env 就位）→ 再改 model_config.toml → 最后 up -d 重建。
      - DEEPSEEK_API_KEY=${DEEPSEEK_API_KEY:-}
      - DASHSCOPE_API_KEY=${DASHSCOPE_API_KEY:-}
#      - EULA_AGREE=8e6e7d647f7f82d6ea98456b73908656 # 同意EULA
#      - PRIVACY_AGREE=91e5db7659c560bc3545e63859b6ebc0 # 同意隐私条款
    ports:
      - "18001:8001" # webui端口
#      - "18121:8121" # QQ用户记忆插件WebUI端口
#      - "28001:28001" # 主动对话插件WebUI端口
#      - "8000:8000"
    volumes:
      # 监听地址和端口会用于生成或迁移 ./docker-config/mmc/bot_config.toml 的 maim_message 与 webui 配置段
      - ./docker-config/mmc:/MaiMBot/config # 持久化bot配置文件
      - ./data/MaiMBot:/MaiMBot/data # 共享目录
      - ./data/MaiMBot/emoji:/data/emoji # 持久化表情包
      # ZG-32: v1 挂载已删除（2026-08-18），收敛到 v2 单一挂载
      - ./plugins:/MaiMBot/plugins-v2 # v2 插件目录（宿主机修改即时生效）
      # - ./data/MaiMBot/logs:/MaiMBot/logs # 2026-10-16 撤：LOG_DIR 已锚数据根，上面 :50 的 ./data/MaiMBot 覆盖同一目录

      - ./depends-data:/MaiMBot/depends-data # 运行时资源文件
      - ./src:/MaiMBot/src # 源码目录（宿主机修改即时生效，无需重建镜像）
      - ./prompts:/MaiMBot/prompts # 提示词目录（宿主机修改即时生效，无需重建镜像）
      - ./agents:/MaiMBot/agents # 智能体配置目录（Markdown Frontmatter格式）
      - ./lab:/MaiMBot/lab # 实验性原型（宿主机修改即时生效，无需重建镜像）

      - ./pyproject.toml:/MaiMBot/pyproject.toml:ro # 主程序版本号（宿主机更新即时反映）
      - ./bot.py:/MaiMBot/bot.py:ro # 主入口脚本
      - ./mingtang/dist:/MaiMBot/mingtang/dist:ro # WebUI构建产物（宿主机npm run build后即时生效）
      - ./locales:/MaiMBot/locales:ro # i18n 翻译文件（宿主机修改即时生效，无需重建镜像）
      # 2026-10-15：移除 site-packages / hf-cache 两个命名卷（旧设计残留：
      # 依赖由镜像内 uv sync 提供、HF 缓存实为仓内 model_cache/，卷已不存在）
    healthcheck:
      test: ["CMD", "test", "-f", "/MaiMBot/mingtang/dist/index.html"]
      interval: 30s
      timeout: 5s
      start_period: 40s
      retries: 3
    restart: always
    networks:
      - maim_bot

  # 启用 HTTPS 时，建议注释掉 core 服务中的 "18001:8001" 端口映射，
  # 然后取消注释此 Caddy 反向代理示例块，并按 dashboard/docs/Caddyfile.docker.example 修改域名。
  # caddy:
  #   image: caddy:2
  #   container_name: maibot-caddy
  #   restart: always
  #   ports:
  #     - "80:80"
  #     - "443:443"
  #   volumes:
  #     - ./dashboard/docs/Caddyfile.docker.example:/etc/caddy/Caddyfile:ro
  #     - caddy_data:/data
  #     - caddy_config:/config
  #   depends_on:
  #     - core
  #   networks:
  #     - maim_bot
  napcat:
    environment:
      - NAPCAT_UID=1000
      - NAPCAT_GID=1000
      - TZ=Asia/Shanghai
    ports:
      - "6099:6099"
    volumes:
      - ./docker-config/napcat:/app/napcat/config # 持久化napcat配置文件
      - ./data/qq:/app/.config/QQ # 持久化QQ本体
      - ./data/MaiMBot:/MaiMBot/data # 共享目录
    container_name: maim-bot-napcat
    restart: always
    # 2026-10-16 修正 tag：v4.18.8 → v4.18.37（原写 v4.18.38 系笔误——Docker Hub 实测该 tag 不存在（404），
    #    最新稳定为 v4.18.37；镜像从未拉取，零成本。NapCat 项目已迁 NapNeko 组织，镜像名不变）
    # ⚠️ 启用 QQ 前先决策：上游 1.3.0 起 QQ 适配器换代——统一 QQ 连接器（SnowLuma/NapCat 双客户端合一）
    #    + adapter_policy.toml 黑白名单；我们的 fork 仍是旧适配器方案，**兼容性需先评估再接线**
    image: mlikiowa/napcat-docker:v4.18.37
    networks:
      - maim_bot
  # sqlite-web 已移除（2026-10-15：从未实际使用；且其为无认证工具，不宜常驻暴露于校园网。
  # 如需翻库：宿主 python/sqlite3 或桌面版 DB Browser 即可）
  # chat2db占用相对较高但是功能强大
  # 内存占用约600m，内存充足推荐选此
  # chat2db:
  #   image: chat2db/chat2db:latest
  #   container_name: maim-bot-chat2db
  #   restart: always
  #   ports:
  #     - "10824:10824"
  #   volumes:
  #     - ./data/MaiMBot:/data/MaiMBot
  #   networks:
  #     - maim_bot

# 2026-10-15：site-packages / hf-cache 两卷已移除（旧设计残留）；
# 当前无命名卷——启用 Caddy 时取消下面注释
# volumes:
#   caddy_data:
#   caddy_config:
networks:
  maim_bot:
    driver: bridge

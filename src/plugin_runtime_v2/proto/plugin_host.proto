syntax = "proto3";

package maibot.plugin.v2;

import "common.proto";

// ============================================================
// Host 端 gRPC 服务
// ============================================================

// Host 端暴露的 gRPC 服务，Runner 连接后调用
service PluginHost {
  // 双向流连接：Runner 通过此流建立持久连接，
  // 首次消息携带 HelloPayload，后续可推送 EventPayload
  rpc Connect(stream RunnerMessage) returns (stream HostMessage);

  // 组件注册：Runner 上报 Tool 和 Event 声明
  rpc RegisterComponents(RegisterComponentsRequest) returns (RegisterComponentsResponse);

  // ── Phoenix-6: SDK 上下文 RPC ──
  // 发送消息
  rpc SendMessage(SendMessageRequest) returns (SendMessageResponse);
  // 键值存储
  rpc StorageGet(StorageGetRequest) returns (StorageGetResponse);
  rpc StorageSet(StorageSetRequest) returns (StorageSetResponse);
  rpc StorageDelete(StorageDeleteRequest) returns (StorageDeleteResponse);
  // 查询会话信息
  rpc GetSessionInfo(GetSessionInfoRequest) returns (GetSessionInfoResponse);
}

// ============================================================
// Phoenix-6: SDK 上下文 RPC 消息
// ============================================================

// ── SendMessage ──
message SendMessageRequest {
  string session_id = 1;          // 会话 ID（必填）
  string message_type = 2;        // 消息类型：TEXT/IMAGE/EMOJI/FORWARD/HYBRID
  string text_content = 3;        // 文本内容（message_type=TEXT）
  string image_base64 = 4;        // 图片 base64（message_type=IMAGE）
  string emoji_base64 = 5;        // 表情包 base64（message_type=EMOJI）
  string forward_message_id = 6;  // 转发消息 ID（message_type=FORWARD）
  string hybrid_payload = 7;      // JSON 格式混合消息（message_type=HYBRID）
}

message SendMessageResponse {
  bool success = 1;       // 是否发送成功
  string error = 2;       // 错误原因：SESSION_NOT_FOUND/SEND_FAILED/SCOPE_DENIED
  string message_id = 3;  // 成功时返回消息 ID
}

// ── Storage ──
message StorageGetRequest {
  string key = 1;            // 键名
  string default_value = 2;  // 默认值（JSON 编码）
}

message StorageGetResponse {
  bool found = 1;    // 是否找到
  string value = 2;  // 值（JSON 编码）
  string error = 3;  // 错误信息
}

message StorageSetRequest {
  string key = 1;    // 键名
  string value = 2;  // 值（JSON 编码）
}

message StorageSetResponse {
  bool success = 1;  // 是否成功
  string error = 2;  // 错误信息
}

message StorageDeleteRequest {
  string key = 1;  // 键名
}

message StorageDeleteResponse {
  bool deleted = 1;  // 是否删除了已有条目
  string error = 2;  // 错误信息
}

// ── GetSessionInfo ──
message GetSessionInfoRequest {
  string session_id = 1;  // 会话 ID
}

message GetSessionInfoResponse {
  bool found = 1;              // 是否找到
  string session_id = 2;       // 会话 ID
  string session_name = 3;     // 会话名称
  string platform = 4;         // 平台
  bool is_group_session = 5;   // 是否群聊
  string primary_agent_id = 6; // 主要智能体 ID
  string error = 7;            // 错误信息
}

// ============================================================
// 组件声明
// ============================================================

// MCP Tool 声明
message ToolDeclaration {
  string name = 1;               // 工具名称（必填，全局唯一）
  string description = 2;        // 工具描述（必填，供 LLM 理解）
  string parameters_schema = 3;  // 参数 JSON Schema（JSON 字符串）
  string output_schema = 4;      // 输出 JSON Schema（可选）
}

// MCP Event 声明
message EventDeclaration {
  string name = 1;          // 事件名称（必填，全局唯一）
  string description = 2;   // 事件描述（必填）
  string event_schema = 3;  // 事件载荷 JSON Schema（JSON 字符串）
}


// MessageGateway 声明（v2 消息网关）
message MessageGatewayDeclaration {
  string name = 1;             // 网关名称（必填，同 plugin 内唯一）
  string platform = 2;         // 平台标识（必填，如 "qq"）
  string protocol = 3;         // 协议标识（必填，如 "onebot11"）
  bool supports_send = 4;      // 是否支持发送（默认 true）
  bool supports_receive = 5;   // 是否支持接收（默认 false）
  string route_type = 6;       // 路由类型（可选）
}

// 组件注册请求
message RegisterComponentsRequest {
  string plugin_id = 1;                  // 插件 ID（必填）
  string plugin_version = 2;             // 插件版本
  repeated ToolDeclaration tools = 3;    // Tool 声明列表
  repeated EventDeclaration events = 4;  // Event 声明列表
  repeated MessageGatewayDeclaration message_gateways = 5;  // MessageGateway 声明列表
}

// 组件注册响应
message RegisterComponentsResponse {
  bool accepted = 1;           // 是否全部接受（必填）
  repeated string reasons = 2; // 拒绝原因列表
}